services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Keep the vector store on the named volume below
      CHROMA_PERSIST_DIR: /app/chroma_db
      CORS_ORIGINS: '["http://localhost:8000","http://localhost:5173"]'
    volumes:
      - chroma_data:/app/chroma_db
    restart: unless-stopped

volumes:
  chroma_data:
